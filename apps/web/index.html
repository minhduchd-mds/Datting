<!doctype html>
<!--
  `data-theme` BẮT BUỘC có mặt: `@datting/ui-web/theme.css` cố ý không có nhánh
  `:root` trần, nên quên thuộc tính này là trang mất sạch màu ngay lập tức.
  Đó là chủ ý — hỏng nhìn thấy được, thay vì âm thầm nhận theme của console.
-->
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datting</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
