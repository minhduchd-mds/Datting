# Môi trường phát triển cục bộ.
#
# ⚠ ĐÂY KHÔNG PHẢI CẤU HÌNH PRODUCTION. Production chạy trên Kubernetes 1.35+
#   với Cilium (CNI) và Istio ambient mode; xem tài liệu kiến trúc mục 3.2.
#
#   docker compose up -d
#   psql postgresql://datting:datting@localhost:5432/datting -f db/migrations/0001_init.sql

services:
  postgres:
    # PostgreSQL 18 + PostGIS. pgvector cài thêm ở bước init (xem ops/).
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: datting
      POSTGRES_PASSWORD: datting
      POSTGRES_DB: datting
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datting"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    # Valkey 9 (BSD, Linux Foundation) — không phải Redis 8 (AGPLv3).
    # Lý do chọn: xem tài liệu kiến trúc mục 3.2.
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  scylla:
    # ScyllaDB 2026.1 LTS — lưu trữ tin nhắn + swipe (append-only).
    image: scylladb/scylla:2026.1
    command: --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1
    ports: ["9042:9042"]
    volumes: [scylladata:/var/lib/scylla]
    healthcheck:
      test: ["CMD-SHELL", "nodetool status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  redpanda:
    # Redpanda tương thích Kafka wire protocol, nhẹ hơn nhiều cho môi trường dev.
    # Production dùng Kafka 4.3 (KRaft) hoặc dịch vụ quản lý.
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092"]
    volumes: [rpdata:/var/lib/redpanda/data]

  qdrant:
    # Qdrant 1.19 — ANN cho embedding two-tower, filterable HNSW + quantization.
    image: qdrant/qdrant:v1.19.0
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrantdata:/qdrant/storage]

  opensearch:
    # Tầng truy hồi geoshard (thay cho Elasticsearch 8 của Tinder).
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]

  match-service:
    build: ./services/match-service
    environment:
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

  ws-gateway:
    build: ./services/ws-gateway
    environment:
      PORT: "8081"
      DRAIN_WINDOW: "25s"
    ports: ["8081:8081"]

volumes:
  pgdata:
  valkeydata:
  scylladata:
  rpdata:
  qdrantdata:
  osdata:
