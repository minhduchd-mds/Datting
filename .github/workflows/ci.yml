# CI: test + đóng gói Android/admin theo production target.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go + core + match-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: make test
      - run: npm run typecheck

  # APK kiểm chứng nhánh production: không dùng DemoApi, bundle trỏ đúng API/WS.
  # AAB phát hành thật vẫn đi qua profile `production` trong apps/mobile/eas.json.
  build-android:
    name: Build APK (production target)
    runs-on: ubuntu-latest
    needs: test
    env:
      EXPO_PUBLIC_APP_MODE: production
      EXPO_PUBLIC_API_BASE: https://api.datting.app
      EXPO_PUBLIC_WS_URL: wss://ws.datting.app/ws
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
      - run: npm ci

      - name: Prebuild (sinh dự án Android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: datting-production-target-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  build-admin:
    name: Build console kiểm duyệt (production target)
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: https://api.datting.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @datting/admin
      - uses: actions/upload-artifact@v5
        with:
          name: admin-console-production-target
          path: apps/admin/dist
          if-no-files-found: error
          retention-days: 30
