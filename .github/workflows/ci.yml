# CI: test + đóng gói APK Android.
#
# Vì sao chạy trên GitHub lại đáng giá ở dự án này: máy dev ra Internet qua
# proxy nội bộ, mà JVM không đọc HTTP_PROXY nên `dl.google.com` (nơi chứa
# Android Gradle Plugin) TIMEOUT HẲN khi build cục bộ — xem "Bẫy môi trường đã
# gặp" trong CLAUDE.md. Runner của GitHub ra thẳng Internet, không dính bẫy đó.
# Nói cách khác đây không phải bản sao cho vui, nó là đường build không proxy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # cho phép bấm chạy tay từ tab Actions

concurrency:
  # Đẩy liên tiếp thì huỷ lượt cũ. Build Android ~20 phút, xếp hàng vô ích rất tốn.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- test
  # Tách khỏi job build: test xong trong ~2 phút, build Android mất ~20. Biết
  # sớm là hỏng logic thì không phải chờ hết build mới thấy.
  test:
    name: Test (Go + core + match-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cache: false — ws-gateway CHỈ dùng thư viện chuẩn, không có go.sum.
      # Để mặc định (cache: true) thì action đi tìm go.sum và fail ngay bước
      # đầu vì không thấy. Ngày nào thêm dependency Go đầu tiên thì bật lại.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm workspaces: CHỈ có một lock file ở gốc. Chạy `npm ci` trong từng
      # package sẽ lỗi "can only install with an existing package-lock.json".
      - run: npm ci

      - run: make test

      - run: npm run typecheck

  # ------------------------------------------------------------- build APK
  build-android:
    name: Build APK (demo, không cần backend)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # AGP cần JDK 17. Runner có sẵn nhiều bản, phải chỉ đúng bản — bản mặc
      # định có thể là 21 và Expo SDK 57 chưa đi cùng nó.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # `apps/mobile/android/` bị gitignore (là artifact của prebuild, không
      # phải nguồn) ⇒ CI phải tự sinh lại. Kèm theo đó nó cũng sinh debug
      # keystore mới, nên APK ra vẫn cài được — chỉ không đẩy Play Store được.
      - name: Prebuild (sinh dự án Android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # KHÔNG set EXPO_PUBLIC_API_BASE. `src/api.ts` dùng `?? ""`, biến rỗng ⇒
      # IS_DEMO = true ⇒ dùng DemoApi. APK chạy độc lập, không cần backend.
      # Đặt một URL chưa tồn tại còn TỆ HƠN bỏ trống: app sẽ tưởng có backend
      # thật rồi treo ở mọi request.
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: datting-demo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------- build web admin
  # Console kiểm duyệt. Rẻ (~30 giây) nên để riêng, không cần chờ test.
  build-admin:
    name: Build console kiểm duyệt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @datting/admin
      - uses: actions/upload-artifact@v4
        with:
          name: admin-console
          path: apps/admin/dist
          if-no-files-found: error
          retention-days: 30
