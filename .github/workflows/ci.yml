# CI: test + đóng gói Android/admin theo production target.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go + core + match-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: make test
      - run: npm run typecheck

  # ---------------------------------------------------------------------
  # Hạ tầng THẬT: PostgreSQL+PostGIS+pgvector và Valkey, cùng phiên bản với
  # docker-compose. Job này tồn tại vì có những thứ con giả không chứng minh
  # được — xem services/match-service/test/valkey.integration.test.ts:
  # script Lua mutual-like nguyên tử hay không thì chỉ một server thật mới trả
  # lời được. Trên máy dev Windows không có Docker nên các bài đó tự bỏ qua;
  # ở đây chúng luôn chạy.
  # ---------------------------------------------------------------------
  integration:
    name: Hạ tầng thật (PostgreSQL + Valkey)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Dựng ảnh Postgres thay vì khai `services:` — service container chỉ nhận
      # ảnh có sẵn, mà ta cần bản CÓ pgvector (xem ops/postgres.Dockerfile).
      - name: Dựng ảnh PostgreSQL kèm pgvector
        run: docker build -f ops/postgres.Dockerfile -t datting-postgres:ci .

      - name: Khởi động PostgreSQL và Valkey
        run: |
          docker run -d --name pg -p 5432:5432             -e POSTGRES_USER=datting -e POSTGRES_PASSWORD=datting -e POSTGRES_DB=datting             datting-postgres:ci
          # Valkey 9 (BSD, Linux Foundation) — không phải Redis 8 (AGPLv3).
          docker run -d --name valkey -p 6379:6379 valkey/valkey:9-alpine             valkey-server --appendonly yes --appendfsync everysec

      - name: Chờ hai dịch vụ sẵn sàng
        run: |
          # --- pg_isready KHONG du, va day la ly do ------------------------
          # Anh postgres chinh thuc chay mot server TAM trong luc initdb de
          # thi hanh cac script khoi tao. pg_isready thay server tam do va bao
          # san sang, roi entrypoint TAT no di de khoi dong server that.
          #
          # Migration chay dung vao khoang trong giua hai lan do thi gay voi
          #   psql: connection to server on socket ... failed: No such file
          # du buoc cho ngay truoc da bao xanh. Da dinh dung loi nay o lan
          # chay CI dau tien.
          #
          # Nen cho theo HAI moc, khong phai mot:
          #   1. dong "PostgreSQL init process complete" - entrypoint in ra
          #      SAU khi initdb xong va TRUOC khi server that khoi dong;
          #   2. mot truy van THAT chay duoc.
          # Moc 2 moi la bang chung; moc 1 de khong hoi vao dung server tam.

          for i in $(seq 1 60); do
            docker logs pg 2>&1 | grep -q "PostgreSQL init process complete" && break
            sleep 2
          done

          # Truy van that, co TRAN. `until` khong gioi han se treo job 6 tieng
          # khi container chet, va log thi khong noi gi.
          san_sang=""
          for i in $(seq 1 60); do
            if docker exec pg psql -U datting -d datting -tAc "SELECT 1" >/dev/null 2>&1; then
              san_sang="co"
              break
            fi
            sleep 2
          done
          if [ -z "$san_sang" ]; then
            echo "PostgreSQL khong nhan truy van sau 120 giay"
            docker logs pg
            exit 1
          fi

          # Valkey khong co giai doan khoi tao nen PING la du.
          for i in $(seq 1 30); do
            docker exec valkey valkey-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec valkey valkey-cli ping | grep -q PONG || { docker logs valkey; exit 1; }

      - name: Chạy migration
        run: |
          # ON_ERROR_STOP=1 là bắt buộc. Không có nó, psql chạy TIẾP sau lỗi:
          # `CREATE EXTENSION vector` gãy thì `profiles` không được tạo mà chín
          # bảng sau vẫn tạo, và migration báo thành công.
          for f in db/migrations/*.sql; do
            echo "── $f"
            docker exec -i pg psql -U datting -d datting -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Xác nhận extension và bảng đã có thật
        run: |
          docker exec pg psql -U datting -d datting -c             "SELECT extname FROM pg_extension WHERE extname IN ('postgis','vector','pg_trgm') ORDER BY 1;"
          # `profiles` là bảng hay biến mất nhất khi pgvector thiếu — kiểm đích danh.
          docker exec pg psql -U datting -d datting -tAc             "SELECT to_regclass('public.profiles') IS NOT NULL;" | grep -q '^t$'

      - run: npm ci

      - name: Test match-service trên Valkey thật
        env:
          VALKEY_URL: redis://127.0.0.1:6379
          DATABASE_URL: postgresql://datting:datting@127.0.0.1:5432/datting
        run: npm test -w @datting/match-service

      - name: Nhật ký khi hỏng
        if: failure()
        run: |
          docker logs pg || true
          docker logs valkey || true

  # APK kiểm chứng nhánh production: không dùng DemoApi, bundle trỏ đúng API/WS.
  # AAB phát hành thật vẫn đi qua profile `production` trong apps/mobile/eas.json.
  build-android:
    name: Build APK (production target)
    runs-on: ubuntu-latest
    needs: test
    env:
      EXPO_PUBLIC_APP_MODE: production
      EXPO_PUBLIC_API_BASE: https://api.datting.app
      EXPO_PUBLIC_WS_URL: wss://ws.datting.app/ws
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
      - run: npm ci

      - name: Prebuild (sinh dự án Android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: datting-production-target-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  build-admin:
    name: Build console kiểm duyệt (production target)
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: https://api.datting.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @datting/admin
      - uses: actions/upload-artifact@v6
        with:
          name: admin-console-production-target
          path: apps/admin/dist
          if-no-files-found: error
          retention-days: 30
