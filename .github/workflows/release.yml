name: Release Android APK

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/core/**
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: true

env:
  EXPO_PUBLIC_APP_MODE: production
  EXPO_PUBLIC_API_BASE: https://api.datting.app
  EXPO_PUBLIC_WS_URL: wss://ws.datting.app/ws

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck -w @datting/mobile

      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p release
          cp "$APK" "release/Datting-Android-v${VERSION}.apk"
          ls -lh release/

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          TAG="v${VERSION}"
          TITLE="Datting ${TAG} — Android Production"

          cat > release-notes.md <<EOF
          # Datting ${TAG}

          Android production APK.

          ## Download
          - Datting-Android-v${VERSION}.apk

          ## Notes
          - Production runtime configuration
          - Updated Datting mobile UI and Discover experience
          - iOS release is handled separately and does not block Android
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" release/*.apk \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi
